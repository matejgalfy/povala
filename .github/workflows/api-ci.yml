# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Povala.Api.Tests/Povala.Api.Tests.csproj
    - name: Build
      run: dotnet build Povala.Api.Tests/Povala.Api.Tests.csproj --no-restore
    - name: Test
      run: dotnet test Povala.Api.Tests/Povala.Api.Tests.csproj --no-build --verbosity normal
