services:
  api:
    build:
      context: .
      dockerfile: Povala.Api/Dockerfile
    image: povala-api
    ports:
      - "5058:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/povala.db"
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    volumes:
      - povala-data:/app/data
    restart: unless-stopped

volumes:
  povala-data:
